<!DOCTYPE html>
<html lang="en">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<!-- The fresh-auth popup callback (contract §5.1, F20): first, before
     anything else loads; the one source shared with index.html. -->
<script src="/static/freshauth-callback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People</title>
<link rel="stylesheet" href="/static/directory.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; }
  h1 { font-size: 1.5rem; color: #f1f5f9; }
  h1 span { color: #3b82f6; }
  .user-badge { background: #1e293b; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
  .user-badge strong { color: #3b82f6; }
  .pd p, .pd ul { margin: 0; }
  .pd p + p { margin-top: 0.25rem; }
</style>
</head>
<body>
<!-- The people listener (people.<domain>): People, Groups, Org chart, My
     apps (myapps.js: the caller's own app settings; myai.js: its
     "Connect your AI" card) and Setup for admins.
     No app or catalog UI here; the API decides what
     each signed-in user may see and do. -->
<div class="container">
  <header>
    <h1><span>&#9906;</span> People</h1>
    <div class="user-badge" id="who" hidden>Signed in as <strong id="who-name"></strong></div>
  </header>
  <main id="people"><noscript>This page needs JavaScript.</noscript></main>
</div>
<script src="/static/directory.js"></script>
<script src="/static/freshauth.js"></script>
<script src="/static/myai.js"></script>
<script src="/static/myapps.js"></script>
<script>
  if (window.portcullisFreshAuthCallback) {
    // The popup handed its result to My apps; close() may be refused.
    document.getElementById('people').textContent = 'Signed in. You can close this window.';
  } else {
    // #invite?username=…&email=…&display_name=…[&groups=a,b] (the
    // Portcullis MCP's invite_person and create_person forms, and the
    // Hub's old #users?create&… links): the invite dialog, pre-filled;
    // the person is created here, where the one-time link is shown.
    const inv = /^#invite(?:\?(.*))?$/.exec(location.hash);
    PortcullisDirectory.show(document.getElementById('people'), {
      listener: 'people',
      hashTabs: true,
      extraTabs: [{ id: 'myapps', label: 'My apps', render: PortcullisMyApps.render }],
      onUser: function (name) {
        document.getElementById('who-name').textContent = name;
        document.getElementById('who').hidden = !name;
      },
    });
    if (inv) {
      // Only these keys, nothing else of the link is ever pre-filled.
      // groups ticks plain groups only, and only for an admin (a
      // delegate's form has no groups; directory.js never ticks an
      // administrator or permission group from a link).
      const given = new URLSearchParams(inv[1] || ''), pre = new URLSearchParams();
      for (const k of ['username', 'email', 'display_name', 'groups']) if (given.has(k)) pre.set(k, given.get(k));
      PortcullisDirectory.openAt('', pre);
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People</title>
<link rel="stylesheet" href="/static/directory.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; }
  h1 { font-size: 1.5rem; color: #f1f5f9; }
  h1 span { color: #3b82f6; }
  .user-badge { background: #1e293b; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
  .user-badge strong { color: #3b82f6; }
  .pd p, .pd ul { margin: 0; }
  .pd p + p { margin-top: 0.25rem; }
</style>
</head>
<body>
<!-- The people listener (people.<domain>): People, Groups, Org chart, My
     apps (myapps.js: the caller's own app settings) and Setup for admins.
     No app or catalog UI here; the API decides what
     each signed-in user may see and do. -->
<script>
  // Fresh-auth popup callback (contract §5.1 "Fresh auth"). My apps opens
  // Keycloak's authorize URL in a popup whose redirect URI is this page;
  // Keycloak sends it back here with ?code=…&state=… (or ?error=…). The
  // code and state are dropped from the URL and history at once. Only a
  // same-origin opener (a guarded read of opener.location.origin: a
  // cross-origin opener throws) gets them, posted to exactly this origin;
  // the popup then closes. Without one, the parameters are ignored and
  // the page loads as usual. The opener (myapps.js) accepts only a
  // message whose event.origin === location.origin and whose state is
  // the one it stored, then deletes its sessionStorage entries.
  window.portcullisFreshAuthCallback = (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('state') && !q.has('error')) return false;
    var msg = { type: 'portcullis-fresh-auth', code: q.get('code') || '', state: q.get('state') || '', error: q.get('error') || '' };
    history.replaceState(null, '', location.pathname + location.hash);
    var op = null;
    try {
      if (window.opener && window.opener !== window && window.opener.location.origin === location.origin) op = window.opener;
    } catch (e) {
      op = null;
    }
    if (!op) return false;
    op.postMessage(msg, location.origin);
    window.close();
    return true;
  })();
</script>
<div class="container">
  <header>
    <h1><span>&#9906;</span> People</h1>
    <div class="user-badge" id="who" hidden>Signed in as <strong id="who-name"></strong></div>
  </header>
  <main id="people"><noscript>This page needs JavaScript.</noscript></main>
</div>
<script src="/static/directory.js"></script>
<script src="/static/myapps.js"></script>
<script>
  if (window.portcullisFreshAuthCallback) {
    // The popup handed its result to My apps; close() may be refused.
    document.getElementById('people').textContent = 'Signed in. You can close this window.';
  } else {
    PortcullisDirectory.show(document.getElementById('people'), {
      listener: 'people',
      hashTabs: true,
      extraTabs: [{ id: 'myapps', label: 'My apps', render: PortcullisMyApps.render }],
      onUser: function (name) {
        document.getElementById('who-name').textContent = name;
        document.getElementById('who').hidden = !name;
      },
    });
  }
</script>
</body>
</html>

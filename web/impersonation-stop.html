<!DOCTYPE html>

<title>Stop signing in as someone else</title>
<link rel="icon" href="/static/favicon.ico" sizes="48x48">

<body class="pc-imp-stop-page">
<!-- The banner and this page's script (sign-in part 3, D43): first in
     <body>. Served with X-Frame-Options DENY and a CSP without inline
     scripts (confirmCSP's rules, form-action 'self'). -->
<script src="/static/impersonation.js"></script>
<!-- The Stop page (contract §5.1, GET /impersonation/stop on the people
     listener): "Stop signing in as <person>", which POSTs
     /api/me/impersonation/stop and then goes to the answer's sign_out, or
     "Nothing to stop" (web/impersonation.js). -->
<main id="imp-stop" class="pd-card pc-imp-stop" data-domain="{{.Domain}}">
  <h1><img class="brand-mark" src="/static/mark.svg" alt="" width="28" height="28"> Stop signing in as someone else</h1>
  <div data-imp-stop-body><p class="pd-muted">Checking…</p></div>
  <noscript>This page needs JavaScript.</noscript>
</main>
</body>
</html>

name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Feature branches (e.g. the cross-repo `instances` branch): tests and an
  # image build, never a push. On main it publishes `edge` like a push: the
  # Dependabot auto-merge job dispatches it after a merge (a GITHUB_TOKEN
  # merge starts no push run). Dispatching on main needs write access, the
  # same trust as pushing to main.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR and main builds are cancelled (the newest main build
  # publishes edge anyway); tag builds have their own ref and always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Module + build cache, keyed on go.sum. PR runs only save to their
          # own PR-ref scope, which main and other PRs can't read.
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -o /dev/null ./cmd/hub

      # .github/automerge/automerge.sh (Dependabot auto-merge): fake gh +
      # fixtures, no network.
      - name: Dependabot auto-merge tests
        run: |
          shellcheck -S warning .github/automerge/*.sh
          bash .github/automerge/test.sh

      # The real templates and core: every published template must load
      # with the Hub's rules (TestRealTemplates*), and the Hub's lists of
      # core names must match core (TestCore*Complete). The same-named
      # branch of each repo when it exists (cross-repo feature branches
      # land together), else main.
      - name: Check out the templates and core (same branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in portcullis-templates portcullis; do
            url="https://github.com/porelli/$repo"
            ref=main
            if [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then ref="$REF"; fi
            echo "$repo: $ref" | tee -a "$GITHUB_STEP_SUMMARY"
            git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/$repo"
          done

      - name: Real templates and core names
        env:
          PORTCULLIS_TEMPLATES_DIR: ${{ runner.temp }}/portcullis-templates
          PORTCULLIS_CORE_DIR: ${{ runner.temp }}/portcullis
        run: go test -count=1 -v -run 'TestRealTemplates|TestCore[A-Za-z]*Complete|TestHelperImagePinned' ./internal/... 2>&1 | grep -E '^(=== RUN|--- |PASS|FAIL|ok|\s+[a-z_]+_test\.go)' ; test "${PIPESTATUS[0]}" = 0

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Pushes (main → edge, v* tags) and dispatched runs on main (the
      # auto-merge job, after a Dependabot merge) publish; PRs and dispatched
      # feature-branch runs just build.
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contract §1: X.Y.Z, X.Y, X and sha-<short> for v* tags; edge for main;
      # never latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # Layer cache. Only main's publishing runs (push, or dispatch on main) write it (mode=max: every stage,
          # both platforms, under one content-addressed scope); PRs and tags
          # only read it. PR-written caches would never be read by main, and
          # tag-ref caches aren't readable from any other ref.
          cache-from: type=gha,scope=image-main
          cache-to: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'type=gha,scope=image-main,mode=max' || '' }}

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the pushed manifest-list digest (covers every tag and platform).
      - name: Sign image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

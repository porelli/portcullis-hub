name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Feature branches (e.g. the cross-repo `instances` branch): tests and an
  # image build, never a push. On main it publishes `edge` like a push: the
  # Dependabot auto-merge job dispatches it after a merge (a GITHUB_TOKEN
  # merge starts no push run). Dispatching on main needs write access, the
  # same trust as pushing to main.
  # compare_ref: compare against this templates/core branch instead (it
  # must exist): a cross-repo merge publishes the Hub's edge from main
  # before core's branch lands (`-f compare_ref=<branch>`).
  workflow_dispatch:
    inputs:
      compare_ref:
        description: templates/core branch to compare against (empty = same-named, else main)
        required: false
        default: ""
      # `-f runner=builder`: the test job runs on the self-hosted dev builder
      # (labels self-hosted, linux, x64, pc-builder; ephemeral, one job per
      # registration). Only a workflow_dispatch can pick it: push and
      # pull_request always run on GitHub's runners, and the build job
      # (GHCR push, cosign's OIDC token) never leaves them.
      runner:
        description: "Where the test job runs: github (GitHub-hosted) or builder (self-hosted dev builder)"
        type: choice
        options: [github, builder]
        default: github

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR and main builds are cancelled (the newest main build
  # publishes edge anyway); tag builds have their own ref and always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'builder' && fromJSON('["self-hosted","linux","x64","pc-builder"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Module + build cache, keyed on go.sum. PR runs only save to their
          # own PR-ref scope, which main and other PRs can't read. Never on
          # the self-hosted builder (runner=builder): it must not write the
          # Actions cache GitHub-hosted runs restore (it has its own caches;
          # .github/lint_builder_cache.sh checks every such step).
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner == 'builder') }}
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # setfacl for folderfix's TestSetfaclBytes (fatal under CI without it).
      - name: install acl
        run: command -v setfacl || { sudo apt-get update -q && sudo apt-get install -y -q acl; }

      # Playwright (pinned with its integrity in .github/uismoke's lockfile,
      # npm ci without install scripts) and its pinned Chromium for the
      # Settings + SSH access computed-style check (TestSettingsControlsStyled,
      # internal/httpapi/webui_uismoke_test.go): PORTCULLIS_UI_SMOKE=require
      # below makes a missing Playwright a failure, not a skip.
      - name: install Playwright + Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/uismoke"
          cp .github/uismoke/package.json .github/uismoke/package-lock.json "$RUNNER_TEMP/uismoke/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/uismoke"
          "$RUNNER_TEMP/uismoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: go test -race
        env:
          NODE_PATH: ${{ runner.temp }}/uismoke/node_modules
          PORTCULLIS_UI_SMOKE: require
        run: go test -race -count=1 -timeout 25m ./...

      # Core's e2e hooks (internal/e2etest) exist only in -tags e2etest
      # builds: their tests run with the tag, and the default binaries
      # (built as the Dockerfiles do, GO_TAGS empty) must not carry the
      # e2etest marker; the tagged ones must (the check works).
      - name: e2etest hooks only with the tag
        run: |
          go test -count=1 -tags e2etest ./internal/e2etest/ ./internal/agent/ ./internal/hub/ -run 'E2E'
          for c in hub portcullis-agent portcullis-relay; do
            CGO_ENABLED=0 go build -trimpath -tags "" -ldflags="-s -w" -o "/tmp/$c" "./cmd/$c"
            if LC_ALL=C grep -a -q PORTCULLIS-E2ETEST-BUILD-HOOKS "/tmp/$c"; then
              echo "::error::default $c binary carries the e2etest hooks"; exit 1
            fi
          done
          for c in hub portcullis-agent; do
            CGO_ENABLED=0 go build -trimpath -tags e2etest -ldflags="-s -w" -o "/tmp/$c-e2e" "./cmd/$c"
            LC_ALL=C grep -a -q PORTCULLIS-E2ETEST-BUILD-HOOKS "/tmp/$c-e2e" || { echo "::error::the e2etest marker check finds nothing in an e2etest $c"; exit 1; }
          done

      # The kube backend against a real API server (envtest, Kubernetes
      # 1.33, the floor): the admission policies and their vectors, the
      # self-test, the Hub's Role (internal/runtime/kube envtest_test.go).
      # setup-envtest is pinned by its module version (go.sum-verified).
      - name: envtest (Kubernetes 1.33)
        run: |
          go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2 use 1.33.x --bin-dir "$RUNNER_TEMP/envtest" -p path > "$RUNNER_TEMP/assets"
          KUBEBUILDER_ASSETS="$(cat "$RUNNER_TEMP/assets")" go test -tags envtest -count=1 -v -run 'Admission|Translated|SelfTest|RoleIsEnough' ./internal/runtime/kube/

      # The shared-folder fixer as root on the runner's ext4 temp dir: real
      # chown, ACL xattrs, mounts, device nodes and the uid-2001 inheritance
      # check (root_test.go, build tag fixerroot; fatal under CI when root,
      # ACLs, getfacl or mount aren't available).
      - name: folderfix root tests
        run: sudo -E env "PATH=$PATH" GOCACHE="$RUNNER_TEMP/gocache-root" go test -tags fixerroot -count=1 -v ./internal/folderfix/

      # The started fixer helper against the runner's Docker daemon
      # (fixer_docker_test.go, build tag docker): a Hub-shaped image of this
      # tree, the real `hub folderfix` scan → snapshot → apply → verify →
      # restore, the helper's capabilities / no-new-privs / network /
      # read-only rootfs from inside, and each capability's necessity.
      # PORTCULLIS_DOCKER_TEST=require: no daemon is a failure, not a skip.
      - name: fixer helper docker tests
        env:
          PORTCULLIS_DOCKER_TEST: require
        run: |
          go vet -tags docker ./internal/hub/
          go test -tags docker -count=1 -v -run 'TestDocker' ./internal/hub/

      # The Portcullis CLI's host agent against real sshd (Debian 13,
      # Ubuntu 24.04, Rocky 9; pinned bases): enrol against a fake Hub,
      # real logins with test-CA certificates, drift, locks, remove.
      - name: host agent against real sshd
        env:
          PORTCULLIS_DOCKER_TEST: require
        run: |
          go vet -tags sshd ./cmd/portcullis/internal/host/
          go test -tags sshd -count=1 -v ./cmd/portcullis/internal/host/

      - name: go build
        run: |
          go build -o /dev/null ./cmd/hub
          go build -o /dev/null ./cmd/portcullis-agent
          go build -o /dev/null ./cmd/portcullis-relay

      # .github/automerge/automerge.sh (Dependabot auto-merge): fake gh +
      # fixtures, no network.
      - name: Dependabot auto-merge tests
        run: |
          shellcheck -S warning .github/automerge/*.sh .github/lint_builder_cache.sh
          bash .github/automerge/test.sh

      # A job that can run on the self-hosted builder never writes the
      # shared Actions cache from there (a byte copy of core's
      # tests/lint_builder_cache.sh).
      - name: No Actions cache write from the builder
        run: bash .github/lint_builder_cache.sh .github/workflows/build.yml

      # The real templates and core: every published template must load
      # with the Hub's rules (TestRealTemplates*), and the Hub's lists of
      # core names must match core (TestCore*Complete). The same-named
      # branch of each repo when it exists (cross-repo feature branches
      # land together), else main.
      - name: Check out the templates and core (same branch, else main)
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          if [ -n "$COMPARE_REF" ] && ! [[ "$COMPARE_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::compare_ref: not a branch name"; exit 1
          fi
          for repo in portcullis-templates portcullis; do
            url="https://github.com/porelli/$repo"
            ref=main
            if [ -n "$COMPARE_REF" ]; then
              # The templates have no such branch on a core-only feature: main.
              if git ls-remote --exit-code --heads "$url" "$COMPARE_REF" >/dev/null; then ref="$COMPARE_REF"
              elif [ "$repo" = portcullis ]; then echo "::error::core has no branch $COMPARE_REF"; exit 1; fi
            elif [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] && [ "$REF" != main ] && git ls-remote --exit-code --heads "$url" "$REF" >/dev/null; then ref="$REF"; fi
            echo "$repo: $ref" | tee -a "$GITHUB_STEP_SUMMARY"
            git clone --quiet --depth=1 --branch "$ref" "$url" "$RUNNER_TEMP/$repo"
          done

      # TestVectorsInSync: the logo lint's vectors are the templates' tests/svg_vectors.json byte for byte.
      - name: Real templates and core names
        env:
          PORTCULLIS_TEMPLATES_DIR: ${{ runner.temp }}/portcullis-templates
          PORTCULLIS_CORE_DIR: ${{ runner.temp }}/portcullis
        run: go test -count=1 -v -run 'TestRealTemplates|TestCore[A-Za-z]*Complete|TestHelperImagePinned|TestVectorsInSync' ./internal/... 2>&1 | grep -E '^(=== RUN|--- |PASS|FAIL|ok|\s+[a-z_]+_test\.go)' ; test "${PIPESTATUS[0]}" = 0

  # The Portcullis CLI (cmd/portcullis) on the three systems people run
  # it on: its own packages only (the Hub's tests run in test).
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: go vet and test (cmd/portcullis)
        shell: bash
        run: |
          go vet ./cmd/portcullis/...
          go test -count=1 ./cmd/portcullis/...

  # The CLI's archives for six targets (-trimpath -buildvcs=true, the
  # go.mod toolchain), SHA256SUMS, and the release binary's checks: it
  # runs, and it has no test override (--people-url is in -tags sshtest
  # builds only). Every run keeps them as a workflow artifact (edge, PRs,
  # dispatches); only cli-release publishes them.
  cli-dist:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # A release is built from a clean cache.
          cache: false
      - name: Build the archives
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a release tag: $REF_NAME"; exit 1; }
            ver="${REF_NAME#v}"
          else
            ver="0.0.0-edge.${SHA:0:12}"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}" exe=portcullis
            [ "$os" = windows ] && exe=portcullis.exe
            dir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=true -ldflags="-s -w -X main.version=$ver" -o "$dir/$exe" ./cmd/portcullis
            name="portcullis_${ver}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$dir" && zip -q -X "$OLDPWD/dist/$name.zip" ./*)
            else
              tar -C "$dir" --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" .
            fi
            if [ "$target" = linux/amd64 ]; then
              "$dir/$exe" version
              # The release binary takes no test override.
              if out="$("$dir/$exe" host enroll --people-url https://people.example.com </dev/null 2>&1)"; then
                echo "::error::the release binary accepted --people-url"; exit 1
              fi
              grep -q 'unknown flag: --people-url' <<<"$out" || { echo "::error::--people-url: $out"; exit 1; }
            fi
            rm -rf "$dir"
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portcullis-cli
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # v* tags only: each archive and SHA256SUMS signed keyless with cosign
  # (<file>.sigstore.json bundles), build provenance attested, all of it
  # uploaded to the tag's GitHub release. The only job with write
  # permissions on contents and attestations.
  cli-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cli-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # gh release upload
      id-token: write      # cosign keyless, attestations
      attestations: write  # actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portcullis-cli
          path: dist
      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the archives (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" --verify-tag --title "$TAG" --notes "Portcullis CLI $TAG: verify with SHA256SUMS, the .sigstore.json bundles (cosign verify-blob) or gh attestation verify."
          gh release upload "$TAG" -R "$REPO" --clobber dist/*

  # The three images of this repo (multiple servers, contract §17): the
  # Hub, the worker agent and the relay, built, tagged, attested and
  # signed the same way.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hub
            dockerfile: Dockerfile
            name: ghcr.io/porelli/portcullis-hub
            cache: image-main
          - image: agent
            dockerfile: Dockerfile.agent
            name: ghcr.io/porelli/portcullis-agent
            cache: image-main-agent
          - image: relay
            dockerfile: Dockerfile.relay
            name: ghcr.io/porelli/portcullis-relay
            cache: image-main-relay
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      IMAGE: ${{ matrix.name }}
      # Pushes (main → edge, v* tags) and dispatched runs on main (the
      # auto-merge job, after a Dependabot merge) publish; PRs and dispatched
      # feature-branch runs just build.
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contract §1: X.Y.Z, X.Y, X and sha-<short> for v* tags; edge for main;
      # never latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      # The build's version, the Hub's and the agent's alike
      # (servers.Compatible): a release tag's semver, else 0.0.0-edge
      # (every edge build is the same, compatible minor).
      - name: Version
        id: version
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          v=0.0.0-edge
          if [ "$IS_TAG" = true ] && [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then v="$TAG_VERSION"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          push: ${{ env.PUSH == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # Layer cache. Only main's publishing runs (push, or dispatch on main) write it (mode=max: every stage,
          # both platforms, under one content-addressed scope); PRs and tags
          # only read it. PR-written caches would never be read by main, and
          # tag-ref caches aren't readable from any other ref.
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && format('type=gha,scope={0},mode=max', matrix.cache) || '' }}

      # The CLI in the image runs (amd64, from the layer cache just built).
      - name: The image's portcullis CLI
        if: matrix.image == 'hub'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hub-cli-check:local
          cache-from: type=gha,scope=image-main
      - name: portcullis version in the image
        if: matrix.image == 'hub'
        run: docker run --rm --entrypoint portcullis hub-cli-check:local version

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign the pushed manifest-list digest (covers every tag and platform).
      - name: Sign image (keyless)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    portcullis.io/instance: app
    portcullis.io/owner: hub
  name: app--m-portcullis-public-strip-app
  namespace: portcullis-edge
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-User: ""
      X_Forwarded_User: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    portcullis.io/instance: app
    portcullis.io/owner: hub
  name: app--r-app-pub
  namespace: portcullis-edge
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`app.example.org`) && PathPrefix(`/s/`)
    middlewares:
    - name: portcullis-public-guard@file
    - name: app--m-portcullis-public-strip-app
      namespace: portcullis-edge
    - name: security-headers@file
    services:
    - kind: Service
      name: app--web
      namespace: portcullis-apps
      port: 8080
  tls:
    options:
      name: public@file

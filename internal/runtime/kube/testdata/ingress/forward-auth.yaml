---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    portcullis.io/instance: app
    portcullis.io/owner: hub
  name: app--r-app
  namespace: portcullis-edge
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`app.example.org`)
    middlewares:
    - name: client-headers@file
    - name: portcullis-auth@file
    - name: portcullis-groups@file
    - name: security-headers@file
    services:
    - kind: Service
      name: app--web
      port: 8080
  tls:
    options:
      name: authaware@file
---
apiVersion: v1
kind: Service
metadata:
  labels:
    portcullis.io/instance: app
    portcullis.io/owner: hub
  name: app--web
  namespace: portcullis-edge
spec:
  externalName: app--web.portcullis-apps.svc.cluster.local
  ports:
  - name: tcp-8080
    port: 8080
    protocol: TCP
  type: ExternalName

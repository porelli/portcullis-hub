---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    portcullis.io/instance: app
    portcullis.io/owner: hub
  name: app--r-app-oauth
  namespace: portcullis-edge
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`app.example.org`) && PathPrefix(`/oauth2/`)
    priority: 100
    services:
    - kind: TraefikService
      name: forward-auth-ext@file
  tls:
    options:
      name: authaware@file

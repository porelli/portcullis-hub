  name: vpn-gateway--vpn-edge
  namespace: portcullis-apps
spec:
  egress:
  - ports:
    - port: 9004
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: portcullis
      podSelector:
        matchLabels:
          portcullis.io/component: wg
  podSelector:
    matchLabels:
      portcullis.io/instance: vpn-gateway
      portcullis.io/vpn-slot: "3"
  policyTypes:
  - Egress
---
# step 1 wait none
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    portcullis.io/instance: vpn-gateway
    portcullis.io/service: headscale
  name: vpn-gateway--headscale
  namespace: portcullis-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      portcullis.io/instance: vpn-gateway
      portcullis.io/service: headscale
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        portcullis.io/services: '{"derp":"derp","headscale":"headscale"}'
      labels:
        portcullis.io/egress: "true"
        portcullis.io/instance: vpn-gateway
        portcullis.io/net-default: "true"
        portcullis.io/service: headscale
        portcullis.io/vpn-slot: "3"
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: HS_LOG
          valueFrom:
            secretKeyRef:
              key: headscale.HS_LOG
              name: vpn-gateway--env
        - name: PORTCULLIS_VPN_EDGE
          valueFrom:
            secretKeyRef:
              key: headscale.PORTCULLIS_VPN_EDGE
              name: vpn-gateway--env
        image: docker.io/headscale/headscale:0.27.0@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: headscale
        resources: {}
        securityContext:
          runAsGroup: 10001
          runAsUser: 10001
      - env:
        - name: PORTCULLIS_VPN_EDGE
          valueFrom:
            secretKeyRef:
              key: derp.PORTCULLIS_VPN_EDGE
              name: vpn-gateway--env
        image: docker.io/library/alpine:3.24.3@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: derp
        resources: {}
        securityContext: {}
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

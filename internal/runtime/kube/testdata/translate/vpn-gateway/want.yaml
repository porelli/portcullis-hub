apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    portcullis.io/instance: vpn-gateway
  name: vpn-gateway--net-default
  namespace: portcullis-apps
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          portcullis.io/instance: vpn-gateway

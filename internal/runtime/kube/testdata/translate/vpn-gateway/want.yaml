# step 0 wait none
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    portcullis.io/instance: vpn-gateway
  name: vpn-gateway--egress
  namespace: portcullis-apps
spec:
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 169.254.0.0/16
        - 192.0.2.10/32
  - ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.0.2.10/32
  podSelector:
    matchLabels:
      portcullis.io/egress: "true"
      portcullis.io/instance: vpn-gateway
  policyTypes:
  - Egress

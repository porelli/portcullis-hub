  name: jobs--perms
  namespace: portcullis-apps
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        portcullis.io/services: '{"perms":"perms"}'
      labels:
        portcullis.io/egress: "true"
        portcullis.io/instance: jobs
        portcullis.io/net-default: "true"
        portcullis.io/one-shot: "true"
        portcullis.io/service: perms
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - sh
        - -c
        - echo chown
        image: docker.io/library/alpine:3.24.3@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: perms
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10001
          runAsUser: 0
      dnsConfig:
        searches:
        - jobs.portcullis-apps.svc.cluster.local
      enableServiceLinks: false
      hostname: perms
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      subdomain: jobs

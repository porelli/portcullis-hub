---
# step 1 wait ready
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    portcullis.io/instance: jobs
    portcullis.io/service: db
  name: jobs--db
  namespace: portcullis-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      portcullis.io/instance: jobs
      portcullis.io/service: db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        portcullis.io/services: '{"db":"db"}'
      labels:
        portcullis.io/instance: jobs
        portcullis.io/net-backend: "true"
        portcullis.io/service: db
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db.POSTGRES_PASSWORD
              name: jobs--env
        image: docker.io/library/postgres:17.6@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres
          failureThreshold: 6
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres
          failureThreshold: 3
          periodSeconds: 10
          timeoutSeconds: 5
        resources: {}
        securityContext:
          runAsGroup: 70
          runAsUser: 70
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres
          failureThreshold: 33
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: vol-db-data
        - mountPath: /portcullis-bin
          name: portcullis-bin
          readOnly: true
      dnsConfig:
        searches:
        - jobs.portcullis-apps.svc.cluster.local
      enableServiceLinks: false
      hostname: db
      initContainers:
      - command:
        - /usr/local/bin/hub
        - seed
        - /usr/local/bin
        - /portcullis-bin
        image: ghcr.io/porelli/portcullis-hub@sha256:1111111111111111111111111111111111111111111111111111111111111111
        imagePullPolicy: IfNotPresent
        name: portcullis-bin
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 70
          runAsUser: 70
        volumeMounts:
        - mountPath: /portcullis-bin
          name: portcullis-bin
      - command:
        - /portcullis-bin/hub
        - seed
        - /var/lib/postgresql/data
        - /portcullis-seed
        image: docker.io/library/postgres:17.6@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: portcullis-seed-1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 70
          runAsUser: 70
        volumeMounts:
        - mountPath: /portcullis-bin
          name: portcullis-bin
          readOnly: true
        - mountPath: /portcullis-seed
          name: vol-db-data
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      subdomain: jobs
      volumes:
      - emptyDir: {}
        name: portcullis-bin
      - name: vol-db-data
        persistentVolumeClaim:
          claimName: jobs--db-data
---

        image: docker.io/library/alpine:3.24.3@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: migrate
        resources: {}
        securityContext:
          runAsUser: 10001
      dnsConfig:
        searches:
        - jobs.portcullis-apps.svc.cluster.local
      enableServiceLinks: false
      hostname: migrate
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      subdomain: jobs

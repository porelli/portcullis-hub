    portcullis.io/instance: ha-no-memlimit
    portcullis.io/service: migrate
  name: ha-no-memlimit--migrate
  namespace: portcullis-apps
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        portcullis.io/services: '{"migrate":"migrate"}'
      labels:
        portcullis.io/egress: "true"
        portcullis.io/instance: ha-no-memlimit
        portcullis.io/net-default: "true"
        portcullis.io/service: migrate
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: portcullis.io/class
                operator: NotIn
                values:
                - small
      automountServiceAccountToken: false
      containers:
      - args:
        - "true"
        image: docker.io/library/alpine:3.24.3@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 512Mi
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
      dnsConfig:
        searches:
        - ha-no-memlimit--pods.portcullis-apps.svc.cluster.local
      enableServiceLinks: false
      hostname: migrate
      priorityClassName: portcullis-normal
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      subdomain: ha-no-memlimit--pods
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 30
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 30

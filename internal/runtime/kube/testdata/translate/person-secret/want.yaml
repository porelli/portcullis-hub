        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /portcullis-bin
          name: portcullis-bin
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: portcullis-bin
      - name: pw-smb-password
        secret:
          defaultMode: 288
          secretName: person-secret--smb-password-pw

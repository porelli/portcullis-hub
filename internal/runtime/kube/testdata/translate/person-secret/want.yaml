# step 1 wait none
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    portcullis.io/instance: person-secret
    portcullis.io/service: samba
  name: person-secret--samba
  namespace: portcullis-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      portcullis.io/instance: person-secret
      portcullis.io/service: samba
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        portcullis.io/services: '{"samba":"samba"}'
      labels:
        portcullis.io/egress: "true"
        portcullis.io/instance: person-secret
        portcullis.io/net-default: "true"
        portcullis.io/service: samba
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/porelli/portcullis-samba:4.22@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: samba
        resources: {}
        securityContext:
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /portcullis/hashes

---
# step 1 wait none
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    portcullis.io/instance: ha-priority
    portcullis.io/service: web
  name: ha-priority--web
  namespace: portcullis-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      portcullis.io/instance: ha-priority
      portcullis.io/service: web
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        portcullis.io/compose-labels: '{"web":{"traefik.enable":"true","traefik.http.routers.echo.entrypoints":"websecure","traefik.http.routers.echo.middlewares":"client-headers@file,portcullis-auth@docker","traefik.http.routers.echo.rule":"Host(`echo.example.org`)","traefik.http.routers.echo.tls.options":"default","traefik.http.services.echo.loadbalancer.server.port":"8080"}}'
        portcullis.io/services: '{"web":"web"}'
      labels:
        portcullis.io/egress: "true"
        portcullis.io/instance: ha-priority
        portcullis.io/net-default: "true"
        portcullis.io/net-portcullis-proxy: "true"
        portcullis.io/service: web
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: portcullis.io/site
                operator: In
                values:
                - office
            weight: 100
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: portcullis.io/class
                operator: NotIn
                values:
                - small
      automountServiceAccountToken: false
      containers:
      - image: docker.io/ealen/echo-server:0.9.2@sha256:abababababababababababababababababababababababababababababababab
        imagePullPolicy: IfNotPresent
        name: web
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          runAsGroup: 10001
          runAsUser: 10001
      dnsConfig:
        searches:
        - ha-priority--pods.portcullis-apps.svc.cluster.local
      enableServiceLinks: false
      hostname: web
      priorityClassName: portcullis-high
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      subdomain: ha-priority--pods
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 30
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 30

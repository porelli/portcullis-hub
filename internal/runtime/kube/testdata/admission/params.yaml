# The params the CLI writes (an example: the test cluster's values).
# Lists are comma-separated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portcullis-admission-params
  namespace: portcullis-apps
data:
  hubImage: ghcr.io/porelli/portcullis-hub@sha256:1111111111111111111111111111111111111111111111111111111111111111
  hubServiceAccount: system:serviceaccount:portcullis:portcullis-hub
  coreNamespace: portcullis
  bindRoots: /srv,/mnt,/media
  corePorts: "80,443,51820,8000,8081,8443,8444"
  podCIDR: 10.42.0.0/16
  serviceCIDR: 10.43.0.0/16
  nodeAddresses: 192.0.2.10/32
  fileMiddlewares: client-headers@file,client-cert-pem@file,rate-limit@file,rate-limit-auth@file,security-headers@file,strip-client-forwarded@file,portcullis-auth@file,portcullis-auth-ext@file,portcullis-groups@file,portcullis-groups-vpn@file,portcullis-public-guard@file,portcullis-public-guard-vpn@file,vpn-required-path@file,group-gate@file,forward-auth-ext@file,mcp-gate@file

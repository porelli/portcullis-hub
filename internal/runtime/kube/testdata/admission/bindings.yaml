# One binding per policy (a binding binds exactly one policy, Task 0 Q4):
# portcullis-apps-guard-<policy>, each to the apps namespace with the
# params ConfigMap; a missing params object denies (fail closed).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: portcullis-apps-guard-pods
spec:
  policyName: portcullis-apps-pods
  validationActions: [Deny]
  paramRef:
    name: portcullis-admission-params
    namespace: portcullis-apps
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: portcullis-apps
---

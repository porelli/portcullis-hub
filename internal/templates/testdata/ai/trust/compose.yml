services:
  web:
    image: wiki
    networks:
      portcullis-proxy: {}
      mcp-trust:
        aliases: [web-internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.wiki.rule: Host(`${PORTCULLIS_HOST_WIKI:-wiki.portcullis.local}`)
      traefik.http.routers.wiki.entrypoints: websecure
      traefik.http.routers.wiki.middlewares: portcullis-auth@docker,portcullis-groups@docker
      traefik.http.services.wiki.loadbalancer.server.port: "8080"
  wiki-mcp:
    image: wiki-mcp
    environment:
      MCP_SECRET: ${MCP_SECRET:?MCP_SECRET must be set}
    networks: [mcp-trust]
  db:
    image: db

networks:
  portcullis-proxy:
    external: true
  mcp-trust:
    internal: true
